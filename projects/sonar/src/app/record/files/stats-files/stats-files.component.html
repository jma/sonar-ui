<dl class="metadata">
  <dt>{{ 'Document views' | translate }}</dt>
  <dd>{{ statistics['record-view'] }}</dd>
</dl>
<p-divider />
<h6>{{ 'File downloads' | translate }}</h6>
<dl class="metadata">
  @for (key of filteredKeys; track $index) {
    <dt>{{ key }}</dt>
    <dd>
      @if(statistics[key]) {
        {{ statistics[key] }}
      } @else {
        0
      }
    </dd>
  }
</dl>
