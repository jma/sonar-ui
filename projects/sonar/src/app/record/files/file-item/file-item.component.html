<p-panel [toggleable]="true" collapsed="true">
  <ng-template pTemplate="header">
    <ng-container
      [ngTemplateOutlet]="fileLink"
      [ngTemplateOutletContext]="{ file: file(), name: file().label }"
    ></ng-container>
  </ng-template>

  <ng-template pTemplate="icons">
    <p-button
      [title]="'remove' | translate"
      [text]="true"
      icon="fa fa-trash"
      class="p-panel-header-icon p-link ui:mr-2"
      (onClick)="deleteFile(file())"
    />
  </ng-template>

  <div class="ui:grid ui:grid-cols-12 ui:gap-4">
    <div class="ui:col-span-12">
      <div class="ui:flex ui:justify-end ui:flex-wrap">
        <p-button
          [label]="'Save' | translate"
          (onClick)="save()"
          icon="pi pi-save"
          size="small"
        />
      </div>
      <p-divider />
      <formly-form
        [model]="model"
        [fields]="fields()"
        [options]="options"
        [form]="form"
      />
    </div>
    <p-divider layout="vertical"></p-divider>
    <div class="ui:col-span-12">
      <div class="ui:flex ui:justify-end ui:flex-wrap">
        <p-fileUpload
          mode="basic"
          [chooseLabel]="'A new version' | translate"
          chooseIcon="pi pi-upload"
          [accept]="file().metadata.mimetype"
          fileLimit="1"
          [auto]="true"
          [maxFileSize]="maxFileSize"
          [customUpload]="true"
          (uploadHandler)="uploadHandler($event)"
        />
      </div>
      <p-divider />
      @if (file().versions) {
      <h5 translate>Versions</h5>
      <ul class="ui:list-none">
        @for (version of file()?.versions; track version) {
        <li>
          <ng-container
            [ngTemplateOutlet]="fileLink"
            [ngTemplateOutletContext]="{
              file: version,
              name: version.created | dateTranslate
            }"
          ></ng-container>
        </li>
        }
      </ul>
      } @else {
      <span translate>No previous version</span>
      }
    </div>
  </div>
</p-panel>

<ng-template #fileLink let-file="file" let-name="name">
  @if (file?.links?.self) {
  <a
    class="ui:flex-grow"
    tabindex="-1"
    [pTooltip]="
      (file.size | filesize) + ' / ' + (file.updated | dateTranslate : 'medium')
    "
    title="download"
    [href]="downloadURL(file)"
    download
    >{{ name }}&nbsp;<i class="fa fa-download"></i
  ></a>
  }
</ng-template>
