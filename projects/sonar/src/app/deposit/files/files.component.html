<h4>{{ 'Main file' | translate }}</h4>
{{ mainFile().key }} ({{ mainFile().size | filesize }})
<a
  href="#"
  class="ui:ml-2"
  (click)="
    $event.preventDefault();
    previewFileKey = mainFile().key;
    isShowPreview = true
  "
>
  <i class="fa fa-eye"></i>
</a>
<a
  [href]="mainFile().key | fileLink : 'deposits' : depositPid() : 'files'"
  target="_blank"
  class="ui:ml-2"
>
  <i class="fa fa-download"></i>
</a>

<div class="ui:ui:mt-5" *ngIf="additionalFiles()?.length > 0">
  <h4>{{ 'Additional files' | translate }}</h4>
  <p *ngFor="let file of additionalFiles()">
    {{ file.key }} ({{ file.size | filesize }})
    <a
      href="#"
      class="ui:ml-2"
      (click)="
        $event.preventDefault(); previewFileKey = file.key; isShowPreview=true
      "
    >
      <i class="fa fa-eye"></i>
    </a>
    <a
      [href]="file.key | fileLink : 'deposits' : depositPid() : 'files'"
      target="_blank"
      class="ui:ml-2"
    >
      <i class="fa fa-download"></i>
    </a>
  </p>
</div>

<!--Preview modal-->

<p-dialog [header]="previewFileKey" [modal]="true" [(visible)]="isShowPreview" [style]="{ width: '25rem' }">
  <iframe
    class="preview-iframe"
    id="preview-iframe"
    width="100%"
    height="500"
    [src]="
    previewFileKey | fileLink : 'deposits' : depositPid() : 'preview'
  "
  style="border: none;"></iframe>
</p-dialog>
